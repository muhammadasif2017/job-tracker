name: Deploy backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/muhammadasif2017/job-tracker-backend

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              # Compose and Caddy config are deployed too (the deploy job
              # syncs the checkout on the VM), so a change to either has to
              # trigger this workflow — otherwise the change lands on main
              # and silently never reaches the server.
              - 'backend/**'
              - '.github/workflows/deploy.yml'
              - 'docker-compose.prod.yml'
              - 'Caddyfile'

  test:
    name: Backend Tests
    needs: changes
    if: |
      always() && !failure() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.relevant == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npx jest

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '~/job-tracker' }}
            # `compose up` reads the compose file from THIS checkout, not from
            # the image, so without a sync every change to docker-compose.prod.yml
            # or the Caddyfile stays on main and never reaches the server. Two
            # such changes (the uploads and redis volumes) had already landed
            # while the checkout sat 209 commits behind.
            # --ff-only on purpose: if someone has edited files here by hand,
            # fail the deploy loudly rather than silently discarding their work
            # the way `reset --hard` would.
            git fetch --prune origin
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
        with:
          # coverage-diff needs the merge base to know which lines changed.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Repo-wide since 2026-09-07: the ~74 files of pre-existing formatting debt
      # were cleared in one pass, so this no longer has to be scoped down to
      # `types/api.generated.ts`. That file still matters most — it regenerates
      # wholesale, so an unformatted commit rewrites all ~3.7k lines (#282 buried
      # a 12-line semantic change in a 7k-line diff that way) — but it is now
      # covered by the same check as everything else.
      - run: npm run format:check

      - run: npx tsc --noEmit

      - run: npm run test:cov

      - name: Coverage of changed lines
        working-directory: .
        run: node scripts/coverage-diff.mjs --base origin/${{ github.base_ref || 'main' }}

      - run: npm run build

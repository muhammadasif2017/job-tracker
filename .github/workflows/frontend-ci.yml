name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'

  test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Scoped to the generated file, not `npm run format:check` (which is
      # repo-wide and currently fails on ~78 hand-written files — separate
      # pre-existing debt). This one regenerates wholesale, so an unformatted
      # commit rewrites all ~3.7k lines: #282 landed it raw from
      # openapi-typescript, burying a 12-line semantic change in a 7k-line
      # diff. `generate:api-types` now pipes through prettier; this keeps it
      # that way. `.husky/` is empty, so the lint-staged config in
      # package.json never runs on commit — CI is the only enforcement point.
      - run: npx prettier --check types/api.generated.ts

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            relevant:
              - 'browser-extension/**'
              - '.github/workflows/extension-ci.yml'

  validate:
    name: Validate extension
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./browser-extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json

      - name: Validate manifest.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Syntax-check every script
        run: for f in *.js; do node --check "$f"; done

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Get installed Playwright version
        id: playwright-version
        # Read the resolved version from the installed package, not the
        # semver range in package.json's devDependencies (e.g. "^1.60.0").
        # The range string doesn't change between patch releases, but the
        # browser revision Playwright expects does - keying the cache off
        # the range let a stale-revision cache silently "hit" and serve a
        # binary path that no longer exists. Root cause of the v2 poisoning.
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # v3: bumped because v2 was still keyed off the devDependencies
          # semver range (see note above) and could get silently poisoned
          # the same way again.
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-v3

      # Don't trust cache-hit alone - a cache saved from a prior interrupted
      # install can report a hit while the browser binary is still missing
      # (this is exactly how the previous cache key got poisoned). Check for
      # the real binary and reinstall if it's not there, regardless of what
      # the cache step reported.
      - name: Check whether Chromium is actually present
        id: chromium-check
        run: |
          if find ~/.cache/ms-playwright -maxdepth 2 -type f -name chrome 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium
        if: steps.chromium-check.outputs.present != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only
        if: steps.chromium-check.outputs.present == 'true'
        run: npx playwright install-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run extension e2e (real Chromium, loads the unpacked extension)
        # Extensions only load in headed Chromium (Playwright can't load
        # --load-extension in real headless mode), so this needs a display.
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-playwright-report
          path: browser-extension/playwright-report/
          retention-days: 14

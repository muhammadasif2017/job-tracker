version: 2
# develop is the default branch (ADR-056), so every entry pins main: dependency
# bumps skip develop and are synced back by sync-develop.yml.
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "main"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "main"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"

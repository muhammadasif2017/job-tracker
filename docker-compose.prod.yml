# Production stack for a single VM (e.g. Oracle Cloud A1) — Caddy terminates TLS,
# only ports 80/443 are exposed. Postgres is hosted on Neon (managed, free tier),
# so there is no database container here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `pull && up -d` recreates this container, and without a volume its /data
    # goes with it — including the RDB snapshots Redis is already writing
    # there. That takes queued and delayed BullMQ jobs, the notifications
    # digest dedup keys, and any in-flight OAuth exchange codes with it.
    # appendonly narrows the loss window from an RDB save point (up to 60s of
    # writes under the default save rules) to roughly one second.
    # maxmemory-policy is pinned because BullMQ requires noeviction — evicting
    # a job hash loses the job silently. It is already the default; stated
    # here so that setting maxmemory later cannot quietly change it.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/muhammadasif2017/job-tracker-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Neon connection string (with ?sslmode=verify-full). Used by the app and by
      # `prisma migrate deploy` on startup.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      # Public base URL of this backend — used to build OAuth callback URLs.
      BACKEND_URL: ${BACKEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      OCI_NAMESPACE: ${OCI_NAMESPACE}
      OCI_REGION: ${OCI_REGION}
      OCI_BUCKET_NAME: ${OCI_BUCKET_NAME}
      OCI_ACCESS_KEY_ID: ${OCI_ACCESS_KEY_ID}
      OCI_SECRET_ACCESS_KEY: ${OCI_SECRET_ACCESS_KEY}
      # Sentry error tracking (ADR-050). Empty means off. The DSN is not a
      # secret: it only lets a client send events to this project.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # Prometheus listener for Alloy (ADR-052). Deliberately not published:
      # only containers on this network reach it, and Caddy proxies 3001 only.
      METRICS_PORT: 9464
    # Only used when STORAGE_DRIVER=local, where resume PDFs are written to
    # /app/uploads inside the container. Without a volume they live in the
    # container's writable layer and `pull && up -d` destroys them, while the
    # Resume rows keep pointing at storage keys that no longer resolve. Kept
    # mounted regardless of driver so switching to local can't lose data; it
    # simply stays empty under STORAGE_DRIVER=oracle.
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  # Scrapes the backend's metrics every 60s and pushes them to Grafana Cloud
  # (ADR-052). Config lives in alloy/config.alloy. No ports: its UI stays on
  # localhost inside the container. The backend does not depend on it, so a
  # broken Alloy never stops the API.
  alloy:
    image: grafana/alloy:v1.20.0
    restart: unless-stopped
    command:
      [
        'run',
        '/etc/alloy/config.alloy',
        '--storage.path=/var/lib/alloy/data',
      ]
    environment:
      # Write-only Grafana Cloud token, set in the VM's .env only. Empty means
      # every push is rejected with 401 and logged; the API is unaffected.
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      # The VM has 1 GB of RAM. The Go runtime collects harder near this
      # soft limit, and mem_limit is the hard stop.
      GOMEMLIMIT: 100MiB
    mem_limit: 160m
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Write-ahead log, so samples queued during a network blip survive a
      # restart.
      - alloy_data:/var/lib/alloy/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  alloy_data:
  backend_uploads:
  redis_data:
  caddy_data:
  caddy_config:
